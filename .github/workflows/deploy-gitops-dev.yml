name: Deploy Frontend to GitOps Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  IMAGE_NAME: nhs0912/sajin-moa-frontend
  GITOPS_REPOSITORY: nhs0912/moa-gitops
  GITOPS_BRANCH: main
  KUSTOMIZE_PATH: workloads/sajin-moa/overlays/dev

jobs:
  build-and-deploy:
    # ARM64 Native GitHub Runner
    # 기존 ubuntu-latest(x86_64) + QEMU 조합 제거
    runs-on: ubuntu-24.04-arm

    steps:
      # ---------------------------------------------------------
      # 1. Frontend 소스 checkout
      # ---------------------------------------------------------
      - name: Checkout frontend repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Docker Image Tag 생성
      #
      # 예:
      # dev-a12bc34
      # ---------------------------------------------------------
      - name: Set image tag
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="dev-${SHORT_SHA}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "--------------------------------"
          echo "SHORT_SHA = ${SHORT_SHA}"
          echo "IMAGE_TAG = ${IMAGE_TAG}"
          echo "--------------------------------"

      # ---------------------------------------------------------
      # 3. Docker Buildx
      #
      # ARM64 Native Runner이므로 QEMU 필요 없음
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 4. Docker Hub 로그인
      # ---------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------
      # 5. Frontend Docker Image Build + Push
      #
      # ARM64 Native Build
      #
      # Docker Hub:
      #
      # nhs0912/sajin-moa-frontend:dev-a12bc34
      # nhs0912/sajin-moa-frontend:dev
      #
      # 두 개 Tag 생성
      # ---------------------------------------------------------
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          # Raspberry Pi ARM64
          platforms: linux/arm64

          build-args: |
            BUILD_ENV=dev

          tags: |
            docker.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            docker.io/${{ env.IMAGE_NAME }}:dev

          # 이전 Docker Layer Cache 사용
          cache-from: type=gha

          # 다음 build를 위해 cache 저장
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # 6. GitOps 저장소 Checkout
      # ---------------------------------------------------------
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: moa-gitops

      # ---------------------------------------------------------
      # 7. Kustomize 설치
      # ---------------------------------------------------------
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      # ---------------------------------------------------------
      # 8. GitOps Kustomize Image Tag 변경
      #
      # 기존:
      #
      # docker.io/nhs0912/moa-frontend
      #
      # →
      #
      # docker.io/nhs0912/sajin-moa-frontend:dev-a12bc34
      #
      # ---------------------------------------------------------
      - name: Update frontend image tag
        working-directory: moa-gitops/${{ env.KUSTOMIZE_PATH }}
        run: |
          kustomize edit set image \
            docker.io/nhs0912/sajin-moa-frontend=docker.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}

          echo ""
          echo "----- Updated kustomization.yaml -----"
          cat kustomization.yaml

      # ---------------------------------------------------------
      # 9. GitOps 변경사항 Commit + Push
      # ---------------------------------------------------------
      - name: Commit and push GitOps changes
        working-directory: moa-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ env.KUSTOMIZE_PATH }}/kustomization.yaml"

          if git diff --cached --quiet; then
            echo "No GitOps changes"
            exit 0
          fi

          git commit \
            -m "deploy(frontend): ${{ steps.vars.outputs.image_tag }}"

          git push origin "${{ env.GITOPS_BRANCH }}"

      # ---------------------------------------------------------
      # 10. Telegram 성공 알림
      # ---------------------------------------------------------
      - name: Telegram success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          message: |
            ✅ MOA Frontend CI / GitOps Success

            Environment : DEV
            Image       : ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            Branch      : ${{ github.ref_name }}
            Commit      : ${{ github.sha }}

            🐳 Docker Hub Image Push 완료
            📦 GitOps Repository 업데이트 완료

            🚀 Argo CD가 Frontend 배포를 진행합니다.

            GitHub Actions:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ---------------------------------------------------------
      # 11. Telegram 실패 알림
      # ---------------------------------------------------------
      - name: Telegram failed
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          message: |
            ❌ MOA Frontend CI / GitOps Failed

            Environment : DEV
            Repository  : ${{ github.repository }}
            Branch      : ${{ github.ref_name }}
            Commit      : ${{ github.sha }}

            ⚠️ Docker Build 또는 GitOps 업데이트에 실패했습니다.

            GitHub Actions:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      #12. Discord Success Message
      - name: Discord notification - success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"content\": \"✅ **sajin-moa Fronted CI 완료**\n\
              Repository: \`${{ github.repository }}\`\n\
              Branch: \`${{ github.ref_name }}\`\n\
              Commit: \`${{ github.sha }}\`\n\
              Image: \`${IMAGE_NAME}:dev-${SHORT_SHA}\`\n\
              GitOps Fronted 저장소 업데이트 완료\"
            }" \
            "$DISCORD_WEBHOOK_URL"

      - name: Discord notification - failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"content\": \"❌ **sajin-moa Fronted CI 실패**\n\
              Repository: \`${{ github.repository }}\`\n\
              Branch: \`${{ github.ref_name }}\`\n\
              Commit: \`${{ github.sha }}\`\n\
              Github Actions 실행을 확인해주세요.\"
            }" \
            "$DISCORD_WEBHOOK_URL"
